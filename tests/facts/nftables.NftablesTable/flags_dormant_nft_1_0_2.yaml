# Real nft 1.0.2 output for a dormant table: its JSON is invalid, so chains are unknown
arg:
  family: inet
  table: pyt
command: tables=$(nft list tables) && if printf '%s\n' "$tables" | grep -qxF 'table inet pyt' ; then listing=$(nft list table inet pyt ) && printf '%s\n' "$listing" | sed -n '2s/^[[:space:]]*flags /flags /p' && nft -j list table inet pyt ; fi
requires_command: nft
output: "flags dormant\n{\"nftables\": [{\"metainfo\": {\"version\": \"1.0.2\", \"release_name\": \"Lester Gooch\", \"json_schema_version\": 1}}, {\"table\": {\"family\": \"inet\", \"name\": \"pyt\", \"handle\": 5, \"flags\": \n"
fact:
  flags:
  - dormant
  objects: []
  chains: {}
