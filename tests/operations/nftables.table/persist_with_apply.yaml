# With path, the file is written only after the table loads
kwargs:
  table: t
  chains:
    input:
      hook: input
      priority: filter - 10
      rules:
      - in_interface: tailscale0
        protocol: tcp
        destination_port: 22
        action: accept
      - protocol: tcp
        destination_port: 22
        action: drop
  path: /etc/nftables.d/t.nft
facts:
  nftables.NftablesTable:
    family=inet, table=t: null
commands:
- - upload
  - |
    table inet t
    delete table inet t
    table inet t {
        chain input {
            type filter hook input priority -10; policy accept;
            iifname "tailscale0" tcp dport 22 accept comment "pyinfra:572f9f930e3546b2"
            tcp dport 22 drop comment "pyinfra:0732729168229951"
        }
    }
  - _tempfile_
- new=; [ ! -d /etc/nftables.d/t.nft ] && mkdir -p -- /etc/nftables.d && [ "$(sha256sum < _tempfile_ |
  cut -d' ' -f1)" = 6af3c0979fdaf84199f12751dc1b4d473add998b6c46016bb69ead6411010551 ] && nft -f _tempfile_
  && new=$(mktemp -- /etc/nftables.d/.t.nft.XXXXXX ) && install -T -m 0644 -- _tempfile_ "$new" && mv
  -f -T -- "$new" /etc/nftables.d/t.nft ; rc=$?; rm -f -- _tempfile_ ; [ -z "$new" ] || rm -f -- "$new";
  exit $rc
