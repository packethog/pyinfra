# Invalid input is rejected before anything runs
kwargs:
  table: t
  family: inet
  chains:
    input:
      hook: input
      priority: 0
      rules:
      - source: 10.0.0.1/8
        action: accept
facts:
  nftables.NftablesTable:
    family=inet, table=t: null
exception:
  name: OperationValueError
  message: 'chains[''input''].rules[0].source: invalid address ''10.0.0.1/8'' (10.0.0.1/8 has host bits
    set)'
