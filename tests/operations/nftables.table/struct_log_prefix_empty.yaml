# Invalid input is rejected before anything runs
kwargs:
  table: t
  family: inet
  chains:
    input:
      hook: input
      priority: 0
      rules:
      - log_prefix: ''
facts:
  nftables.NftablesTable:
    family=inet, table=t: null
exception:
  name: OperationValueError
  message: 'chains[''input''].rules[0].log_prefix: must be a non-empty string without double quotes or
    control characters'
