# Invalid input is rejected before anything runs
kwargs:
  table: t
  family: inet
  chains:
    input:
      hook: input
      priority: 0
      rules:
      - include "/etc/evil.nft"
facts:
  nftables.NftablesTable:
    family=inet, table=t: null
exception:
  name: OperationValueError
  message: 'chains[''input''].rules[0]: rule can''t start with ''include'''
