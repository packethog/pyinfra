# Invalid input is rejected before anything runs
kwargs:
  table: t
  family: inet
  chains:
    input:
      hook: input
      priority: 0
      rules:
      - protocol: tcp
        destination_port: true
        action: accept
facts:
  nftables.NftablesTable:
    family=inet, table=t: null
exception:
  name: OperationValueError
  message: 'chains[''input''].rules[0].destination_port: invalid port True'
